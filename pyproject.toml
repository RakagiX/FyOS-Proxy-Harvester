[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fyos-proxy-harvester"
version = "2.5.0"
authors = [
  { name="FyOS - ConFEx CCP" },
]
description = "FyOS Proxy Harvester - State-of-the-Art Multi-Protocol Proxy Harvester, Intelligent Health-Scored Rotating Gateway & Interactive Dashboard"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
]

[project.optional-dependencies]
fast = [
    "curl_cffi>=0.7.0",
]

[project.scripts]
fyos-proxy = "main:main"
fyosproxy = "main:main"
omni-proxy = "main:main"
petani-proxy = "main:main"
petaniproxy = "main:main"

[project.urls]
"Homepage" = "https://github.com/FyOS/proxy-harvester"
